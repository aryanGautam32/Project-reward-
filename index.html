<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project & Reward</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 18px;
      border-radius: 14px;
      box-shadow: 0 3px 12px #ddd;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .badge {
      display: inline-block;
      background: #dcfce7;
      color: #166534;
      padding: 6px 12px;
      border-radius: 20px;
    }

    #connection {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <h1>Project & Reward</h1>
    <p>Projects complete करें और rewards पाएँ</p>
  </header>

  <div class="container">

    <div class="card">
      <h2>Welcome 👋</h2>
      <p>Project & Reward में आपका स्वागत है।</p>

      <button onclick="testSupabase()">Supabase Test</button>

      <p id="connection">Connection checking...</p>
    </div>

    <div class="card">
      <h2>Available Projects</h2>
      <p>Active projects यहाँ दिखाई देंगे।</p>
      <span class="badge">Active</span>
    </div>

    <div class="card">
      <h2>My Submissions</h2>
      <p>आपके submitted projects यहाँ दिखाई देंगे।</p>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      'https://dyzovomxtyshtfftvocb.supabase.co';

    const SUPABASE_ANON_KEY =
      'sb_publishable_EJsYtBEjZU4LIqt4-rnWkQ_vrrTbJ48';

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    async function testSupabase() {

      const connection =
        document.getElementById('connection');

      connection.innerText = '⏳ Connecting...';

      const { data, error } = await supabaseClient
        .from('projects')
        .select('id')
        .limit(1);

      if (error) {

        connection.innerText =
          '❌ Connection error: ' + error.message;

      } else {

        connection.innerText =
          '✅ Supabase connected successfully!';

      }
    }
  </script>

</body>
</html>
