<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project & Reward</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    .container {
      max-width: 500px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 18px;
      border-radius: 14px;
      box-shadow: 0 3px 12px #ddd;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 8px;
    }

    .logout {
      background: #dc2626;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }

    #dashboard {
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h1>Project & Reward</h1>
  <p>Projects complete करें और rewards पाएँ</p>
</header>

<div class="container">

  <!-- AUTH CARD -->
  <div class="card" id="authCard">

    <h2>Login</h2>

    <input
      type="email"
      id="loginEmail"
      placeholder="Email"
    >

    <input
      type="password"
      id="loginPassword"
      placeholder="Password"
    >

    <button onclick="login()">Login</button>

    <hr>

    <h2>Sign Up</h2>

    <input
      type="email"
      id="signupEmail"
      placeholder="Email"
    >

    <input
      type="password"
      id="signupPassword"
      placeholder="Password"
    >

    <button onclick="signup()">Create Account</button>

    <p id="message"></p>

  </div>

  <!-- DASHBOARD -->
  <div class="card" id="dashboard">

    <h2>Welcome 👋</h2>

    <p id="userEmail"></p>

    <button onclick="logout()" class="logout">
      Logout
    </button>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    'https://dyzovomxtyshtfftvocb.supabase.co';

  const SUPABASE_ANON_KEY =
    'sb_publishable_EJsYtBEjZU4LIqt4-rnWkQ_vrrTbJ48';

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  // SIGN UP
  async function signup() {

    const email =
      document.getElementById('signupEmail').value.trim();

    const password =
      document.getElementById('signupPassword').value;

    const message =
      document.getElementById('message');

    if (!email || !password) {
      message.innerText =
        '❌ Email और password भरें।';
      return;
    }

    if (password.length < 6) {
      message.innerText =
        '❌ Password कम से कम 6 characters का होना चाहिए।';
      return;
    }

    message.innerText =
      '⏳ Account बनाया जा रहा है...';

    const { data, error } =
      await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

    if (error) {

      message.innerText =
        '❌ ' + error.message;

      return;
    }

    if (data.user) {

      const { error: profileError } =
        await supabaseClient
          .from('profiles')
          .insert({
            id: data.user.id,
            role: 'user'
          });

      if (profileError) {

        message.innerText =
          '⚠️ Account बन गया, लेकिन profile बनाने में समस्या: ' +
          profileError.message;

        return;
      }
    }

    message.innerText =
      '✅ Account बन गया! अब Login करें।';
  }


  // LOGIN
  async function login() {

    const email =
      document.getElementById('loginEmail').value.trim();

    const password =
      document.getElementById('loginPassword').value;

    const message =
      document.getElementById('message');

    if (!email || !password) {

      message.innerText =
        '❌ Email और password भरें।';

      return;
    }

    message.innerText =
      '⏳ Login हो रहा है...';

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      message.innerText =
        '❌ ' + error.message;

      return;
    }

    showDashboard(data.user);
  }


  // DASHBOARD
  function showDashboard(user) {

    document.getElementById('authCard').style.display =
      'none';

    document.getElementById('dashboard').style.display =
      'block';

    document.getElementById('userEmail').innerText =
      'Logged in as: ' + user.email;
  }


  // LOGOUT
  async function logout() {

    await supabaseClient.auth.signOut();

    document.getElementById('dashboard').style.display =
      'none';

    document.getElementById('authCard').style.display =
      'block';

    document.getElementById('message').innerText =
      '✅ Logout हो गया।';
  }


  // CHECK EXISTING LOGIN
  async function checkUser() {

    const { data } =
      await supabaseClient.auth.getUser();

    if (data.user) {
      showDashboard(data.user);
    }
  }

  checkUser();

</script>

</body>
</html>
