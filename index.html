<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}

<body>
<div id="app"></div>
<script>
const SUPABASE_URL="https://dyzovomxtyshtfftvocb.supabase.co";
const SUPABASE_KEY="sb_publishable_EJsYtBEjZU4LIqt4-rnWkQ_vrrTbJ48";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const ADMIN_EMAIL="aryanjatavji77@gmail.com";
let user=null, profile=null, selected=null;

const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function msg(t,type="success"){return `<div class="${type}">${esc(t)}</div>`}
function money(n){return "₹"+Number(n||0).toFixed(2)}
function nav(){
 return `<div class="nav">
 <button onclick="show('home')"><b>⌂</b>Home</button>
 <button onclick="show('projects')"><b>📂</b>Projects</button>
 <button onclick="show('earning')"><b>₹</b>Earning</button>
 <button onclick="show('work')"><b>✓</b>My Work</button>
 <button onclick="show('profile')"><b>👤</b>Profile</button></div>`;
}
function shell(title,body){
 app.innerHTML=`<div class="top"><h1>${title}</h1><p>Project & Earning</p></div><div class="wrap">${body}</div>${nav()}`;
}
async function loadProfile(){
 if(!user)return;
 const {data}=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
 profile=data||null;
}
async function start(){
 const {data:{session}}=await sb.auth.getSession();
 user=session?.user||null;
 if(user){await loadProfile();show("home")}else auth();
}
function auth(){
 app.innerHTML=`<div class="wrap" style="padding-top:45px">
 <div class="card center"><h1>🚀 Project & Earning</h1><p class="muted">Login या नया account बनाएं</p></div>
 <div class="card">
 <h2>📱 Mobile OTP</h2>
 <p class="muted">Phone number से OTP login/signup</p>
 <input id="phone" placeholder="+91XXXXXXXXXX">
 <button class="btn" onclick="sendOtp()">OTP भेजें</button>
 <div id="otpbox" class="hidden"><input id="otp" placeholder="6 digit OTP"><button class="btn green" onclick="verifyOtp()">Verify OTP</button></div>
 </div>
 <div class="card">
 <h2>📧 Email + Password</h2>
 <input id="email" type="email" placeholder="Email">
 <input id="pass" type="password" placeholder="Password (कम से कम 6 characters)">
 <div class="row"><button class="btn" onclick="emailSignup()">Signup</button><button class="btn secondary" onclick="emailLogin()">Login</button></div>
 </div>
 <div id="authmsg"></div>
 </div>`;
}
async function sendOtp(){
 const phone=document.getElementById("phone").value.trim();
 if(!phone)return document.getElementById("authmsg").innerHTML=msg("Phone number डालें","error");
 const {error}=await sb.auth.signInWithOtp({phone});
 document.getElementById("authmsg").innerHTML=error?msg(error.message,"error"):msg("OTP भेज दिया गया।");
 document.getElementById("otpbox").classList.remove("hidden");
}
async function verifyOtp(){
 const phone=document.getElementById("phone").value.trim(),token=document.getElementById("otp").value.trim();
 const {error}=await sb.auth.verifyOtp({phone,token,type:"sms"});
 if(error)return document.getElementById("authmsg").innerHTML=msg(error.message,"error");
 user=(await sb.auth.getUser()).data.user;
 await loadProfile();
 if(!profile)await sb.from("profiles").insert({id:user.id,mobile:phone});
 await loadProfile(); show("profile");
}
async function emailSignup(){
 const email=document.getElementById("email").value.trim(),password=document.getElementById("pass").value;
 if(!email||password.length<6)return document.getElementById("authmsg").innerHTML=msg("Email और 6+ character password डालें","error");
 const {data,error}=await sb.auth.signUp({email,password});
 if(error)return document.getElementById("authmsg").innerHTML=msg(error.message,"error");
 if(data.user){
   user=data.user;
   const {error:e}=await sb.from("profiles").upsert({id:user.id}, {onConflict:"id"});
   if(e)document.getElementById("authmsg").innerHTML=msg(e.message,"error");
   else document.getElementById("authmsg").innerHTML=msg("Signup हो गया। Email verification मांगे तो email verify करें, फिर login करें।");
 }
}
async function emailLogin(){
 const email=document.getElementById("email").value.trim(),password=document.getElementById("pass").value;
 const {data,error}=await sb.auth.signInWithPassword({email,password});
 if(error)return document.getElementById("authmsg").innerHTML=msg(error.message,"error");
 user=data.user;await loadProfile();show("home");
}
async function logout(){await sb.auth.signOut();user=null;profile=null;auth()}

async function show(page){
 if(!user)return auth();
 await loadProfile();
 if(page==="home")return home();
 if(page==="projects")return projects();
 if(page==="earning")return earning();
 if(page==="work")return work();
 if(page==="profile")return profilePage();
 if(page==="admin")return admin();
 if(page==="parent")return admin();
}
function home(){
 shell("🏠 Home",`<div class="card"><h2>Hello, ${esc(profile?.name||"User")} 👋</h2><p class="muted">Available projects से काम शुरू करें और approved work पर earning पाएं.</p><button class="btn" onclick="show('projects')">View Projects</button></div>
 <div class="grid"><div class="stat">📂<b>Projects</b><span class="muted">Available work</span></div><div class="stat">💰<b>Earning</b><span class="muted">Approved balance</span></div><div class="stat">📤<b>Submit</b><span class="muted">Proof भेजें</span></div><div class="stat">🏦<b>Withdraw</b><span class="muted">UPI / Bank</span></div></div>
 ${profile?.role==="admin"||profile?.role==="parent"?`<div class="card"><button class="btn" onclick="show('admin')">🛠️ Admin / Parent Dashboard</button></div>`:""}`);
}
async function projects(){
 const {data,error}=await sb.from("projects").select("id,title,description,instructions,reward,deadline,link,link_type,status,created_by,created_at").eq("status","active").order("created_at",{ascending:false});
 if(error)return shell("Projects",msg(error.message,"error"));
 const list=(data||[]).map(p=>`<div class="project"><span class="badge">${esc(p.link_type||"Other Link")}</span><h3>${esc(p.title)}</h3><p>${esc(p.description||"")}</p><b>${money(p.reward)}</b><br><button class="btn" style="margin-top:10px" onclick='details(${JSON.stringify(p).replace(/</g,"\\u003c")})'>Open Project</button></div>`).join("");
 shell("📂 Projects",list||`<div class="card center">अभी कोई active project नहीं है.</div>`);
}
function details(p){
 selected=p;
 shell("📋 Project Details",`<div class="card"><span class="badge">${esc(p.link_type||"Other Link")}</span><h2>${esc(p.title)}</h2><p>${esc(p.description||"")}</p><h3>💰 Earning: ${money(p.reward)}</h3><h3>Instructions</h3><p>${esc(p.instructions||"Project पूरा करके proof submit करें.")}</p>${p.deadline?`<p class="muted">Deadline: ${esc(new Date(p.deadline).toLocaleString())}</p>`:""}<div class="row">${p.link?`<button class="btn" onclick="window.open('${esc(p.link)}','_blank')">🔗 Open Link</button>`:""}<button class="btn green" onclick="submitPage('${p.id}')">📤 Submit Work</button></div></div>`);
}
function submitPage(id){
 const p=selected;
 shell("📤 Submit Work",`<div class="card"><h2>${esc(p?.title||"Project")}</h2><label>Screenshot / Proof URL</label><input id="proof" placeholder="https://..."><label>Submission / Details</label><textarea id="subtext" rows="5" placeholder="काम कैसे पूरा किया, लिखें"></textarea><button class="btn green" onclick="submitWork('${id}')">Submit</button><div id="submsg" style="margin-top:10px"></div></div>`);
}
async function submitWork(projectId){
 const proof=document.getElementById("proof").value.trim(),text=document.getElementById("subtext").value.trim();
 if(!proof||!text)return document.getElementById("submsg").innerHTML=msg("Proof और submission details भरें","error");
 const {error}=await sb.from("Submission").insert({"Project_id":projectId,"User_id":user.id,"Screenshot_url":proof,"Submission":text,status:"pending"});
 document.getElementById("submsg").innerHTML=error?msg(error.message,"error"):msg("Submission भेज दी गई। Approval के बाद earning जुड़ जाएगी।");
}
async function work(){
 const {data,error}=await sb.from("Submission").select("*").eq("User_id",user.id);
 if(error)return shell("My Work",msg(error.message,"error"));
 shell("✓ My Work",(data||[]).map(x=>`<div class="card"><b>Project:</b> ${esc(x.Project_id)}<p>Status: <span class="badge">${esc(x.status)}</span></p><p class="small">Proof: ${esc(x.Screenshot_url||"")}</p></div>`).join("")||`<div class="card center">अभी कोई submission नहीं है.</div>`);
}
async function earning(){
 const {data,error}=await sb.from("user_earning_balance").select("available_balance").eq("user_id",user.id).maybeSingle();
 const bal=data?.available_balance||0;
 const {data:hist}=await sb.from("withdrawal_history").select("*").eq("user_id",user.id).order("created_at",{ascending:false});
 shell("💰 Earning",`<div class="grid"><div class="stat">Available<b>${money(bal)}</b></div><div class="stat">Minimum<b>₹10</b></div></div>

 <div class="card"><h2>📜 Withdrawal History</h2>${(hist||[]).map(x=>`<div class="project"><b>${money(x.amount)}</b> — ${esc(x.payment_method)}<br><span class="badge">${esc(x.status)}</span><p class="small">${esc(x.created_at)}</p></div>`).join("")||"<p class='muted'>No withdrawals yet.</p>"}</div>`);
}
function toggleWithdraw(){const m=document.getElementById("wmethod").value;document.getElementById("wupi").classList.toggle("hidden",m!=="UPI");document.getElementById("wbank").classList.toggle("hidden",m!=="Bank")}
async function withdraw(){
 const amount=Number(document.getElementById("wamount").value),method=document.getElementById("wmethod").value;
 const obj={"Users id":user.id,"Amount":amount,"Payment method":method};
 if(method==="UPI"){obj.upi_app=document.getElementById("upiapp").value;obj.upi_id=document.getElementById("upiid").value.trim()}
 else {obj.account_holder_name=document.getElementById("ah").value.trim();obj.bank_name=document.getElementById("bn").value.trim();obj.account_number=document.getElementById("an").value.trim();obj.ifsc_code=document.getElementById("ifsc").value.trim()}
 const {error}=await sb.from("Payment").insert(obj);
 document.getElementById("wmsg").innerHTML=error?msg(error.message,"error"):msg("Withdrawal request भेज दी गई। Admin/Parent review करेगा.");
 if(!error)setTimeout(()=>earning(),900);
}
async function profilePage(){
 shell("👤 Profile",`<div class="card"><label>Name</label><input id="pname" value="${esc(profile?.name||"")}"><label>Mobile</label><input value="${esc(profile?.mobile||user.phone||"")}" disabled><label>Email</label><input value="${esc(user.email||"")}" disabled><label>UPI App</label><select id="papp"><option value="">Select</option>${["PhonePe","Google Pay","Navi","Other UPI"].map(x=>`<option ${profile?.upi_app===x?"selected":""}>${x}</option>`).join("")}</select><label>UPI ID</label><input id="pupi" value="${esc(profile?.upi_id||"")}"><hr><label>Account Holder Name</label><input id="pah" value="${esc(profile?.account_holder_name||"")}"><label>Bank Name</label><input id="pbn" value="${esc(profile?.bank_name||"")}"><label>Account Number</label><input id="pan" value="${esc(profile?.account_number||"")}"><label>IFSC</label><input id="pifsc" value="${esc(profile?.ifsc_code||"")}"><button class="btn green" onclick="saveProfile()">Save Profile</button><div id="pmsg"></div></div><div class="card"><button class="btn danger" onclick="logout()">Logout</button></div>${profile?.role==="admin"||profile?.role==="parent"?`<div class="card"><button class="btn" onclick="show('admin')">Dashboard</button></div>`:""}`);
}
async function saveProfile(){
 const o={id:user.id,name:document.getElementById("pname").value.trim(),upi_app:document.getElementById("papp").value||null,upi_id:document.getElementById("pupi").value.trim()||null,account_holder_name:document.getElementById("pah").value.trim()||null,bank_name:document.getElementById("pbn").value.trim()||null,account_number:document.getElementById("pan").value.trim()||null,ifsc_code:document.getElementById("pifsc").value.trim()||null};
 const {error}=await sb.from("profiles").upsert(o,{onConflict:"id"});
 document.getElementById("pmsg").innerHTML=error?msg(error.message,"error"):msg("Profile save हो गया.");
 await loadProfile();
}
async function admin(){
 if(!['admin','parent'].includes(profile?.role))return show('home');
 const {data:subs}=await sb.from('Submission').select('*').order('status');

 <div class="card"><h2>📤 Submissions</h2>${(subs||[]).map(x=>`<div class="project"><p>${esc(x.Submission||'')}</p><p class="small">User: ${esc(x.User_id)}</p><p>Status: <span class="badge">${esc(x.status)}</span></p>${x.status==='pending'?`<div class="row"><button class="btn green" onclick="reviewSubmission('${x.Id}','approved')">Approve</button><button class="btn danger" onclick="reviewSubmission('${x.Id}','rejected')">Reject</button></div>`:''}</div>`).join('')||'<p class="muted">No submissions.</p>'}</div>

}
async function createProject(){
 if(!['admin','parent'].includes(profile?.role))return;
 const title=document.getElementById('aTitle').value.trim();
 const description=document.getElementById('aDesc').value.trim();
 const instructions=document.getElementById('aInst').value.trim();
 const reward=Number(document.getElementById('aReward').value||0);
 const deadline=document.getElementById('aDeadline').value;
 const link=document.getElementById('aLink').value.trim();
 const link_type=document.getElementById('aType').value;
 if(!title||reward<0){document.getElementById('projectMsg').innerHTML=msg('Title और earning भरें','error');return;}
 const {error}=await sb.from('projects').insert({title,description,instructions,reward,deadline:deadline?new Date(deadline).toISOString():null,link,link_type,status:'active',created_by:user.id});
 document.getElementById('projectMsg').innerHTML=error?msg(error.message,'error'):msg('Project add हो गया।');
 if(!error)setTimeout(()=>admin(),700);
}

}
